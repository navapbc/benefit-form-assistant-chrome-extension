<!doctype html>

  <body>
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M6 4.75h9.2a2.8 2.8 0 0 1 2.8 2.8v8.9a2.8 2.8 0 0 1-2.8 2.8H6a2 2 0 0 1-2-2V6.75a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.8"/>

        </svg>
      </div>
      <div class="app-title">Form-Filling Assistant</div>
      <button class="icon-button" type="button" data-action="home" aria-label="Return to assistant home">×</button>
    </header>

    <div id="preview-banner" class="preview-banner" role="status" hidden>Simulated UI preview · no browser form or database is being used</div>

    <main id="app" class="app-main" aria-live="polite"></main>

    <footer class="app-footer">
      <span class="privacy-dot" aria-hidden="true"></span>
      You review and submit. The assistant never submits.
    </footer>
