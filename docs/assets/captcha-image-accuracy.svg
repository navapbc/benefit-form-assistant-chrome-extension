<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title desc"><title id="title">Exact matching CAPTCHA tile sets on one captured grid</title><desc id="desc">Two repeats of one traffic-light grid. Sol Low and Extra High each two correct; Luna Low and Extra High each one; Nano zero. Eve delivered one correct answer and one missing structured result after six earlier timeouts. Jev image input untested.</desc><rect width="860" height="420" fill="#f4f7f8"/><g font-family="system-ui, sans-serif" fill="#173d51"><text x="24" y="38" font-size="24" font-weight="700">Image accuracy on one common CAPTCHA grid</text><text x="24" y="65" font-size="15">Two repeats · manually reviewed tiles · saved-image answers, separate from site acceptance</text><text x="24" y="122" font-size="16">CLI · Sol Low</text><rect x="270" y="103" width="480" height="27" rx="4" fill="#dce5e9"/><rect x="270" y="103" width="480" height="27" rx="4" fill="#356f91"/><text x="765" y="122" font-size="16" font-weight="700">2/2</text><text x="24" y="167" font-size="16">CLI · Sol Extra High</text><rect x="270" y="148" width="480" height="27" rx="4" fill="#dce5e9"/><rect x="270" y="148" width="480" height="27" rx="4" fill="#356f91"/><text x="765" y="167" font-size="16" font-weight="700">2/2</text><text x="24" y="212" font-size="16">CLI · Luna Low</text><rect x="270" y="193" width="480" height="27" rx="4" fill="#dce5e9"/><rect x="270" y="193" width="240" height="27" rx="4" fill="#356f91"/><text x="765" y="212" font-size="16" font-weight="700">1/2</text><text x="24" y="257" font-size="16">CLI · Luna Extra High</text><rect x="270" y="238" width="480" height="27" rx="4" fill="#dce5e9"/><rect x="270" y="238" width="240" height="27" rx="4" fill="#356f91"/><text x="765" y="257" font-size="16" font-weight="700">1/2</text><text x="24" y="302" font-size="16">Nano · Chrome managed</text><rect x="270" y="283" width="480" height="27" rx="4" fill="#dce5e9"/><rect x="270" y="283" width="0" height="27" rx="4" fill="#356f91"/><text x="765" y="302" font-size="16" font-weight="700">0/2</text><text x="24" y="354" font-size="15">Eve: one correct answer + one missing result after fixing attachment setup; six prior timeouts retained.</text><text x="24" y="380" font-size="15">Jev: image input untested. One unique grid does not establish general CAPTCHA reliability.</text></g></svg>
